[workspace]
members = [".", "nv-core"]

[package]
name = "nv-gtk"
version = "0.1.1"
edition = "2021"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
notify = "6.1"
pulldown-cmark = "0.12"
regex = "1.10"
nv_core = { path = "nv-core" }

